schema_version: "1.0"
name: to-prd-readiness-section
summary: "A readiness block in the conversation becomes a `## Readiness` section in the PRD."
description: >
  `to-prd` after a grill and a `/lk:readiness` pass, with the block printed in the prompt as
  the conversation would hold it. The external behaviour under test is the PRD body: it carries
  a `## Readiness` section with the block's items. A PRD written from a conversation with no
  block must carry no such section; that half is checked by the sibling case
  `to-prd-no-readiness-section`. There is no tracker and no network here, so the prompt has the
  run write the body to a file instead of publishing it.
tags: [micro, to-prd, to-prd-tasks]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project, already a git repository with one commit
    (`fixture: scaffold snapshot`). Its adapter is `.claude/project/adapter.md`.

    There is no network and no tracker credential here, so do not run `gh` and do not publish.
    Write the PRD exactly as it would be published, title line first and then the body, to `./prd.md`. Do not interview me
    and do not ask the module-confirmation questions; treat them as confirmed.

    The grill settled this plan:

    - `countShelves` in `lib/shelf-count.ts` counts archived shelves, so the header total
      overstates what a user can open. It must count only shelves whose `archived` is `false`.
    - Archived shelves never count toward the total. Nothing calls the function with an
      "include archived" option.
    - The archive action itself is out of scope.

    `/lk:readiness` then ran, and this block is in the conversation:

    ## Readiness

    ### Missing context
    - The export job's path — given: `lib/export.ts`

    ### Credential or access
    - Read-only staging catalog key — external step: request it from the platform team

    ### External dependency
    - Shelf-schema ticket ATL-88 — external step: wait for it to land

    ### Ambiguous acceptance criterion
    - "Export behaves sensibly" — given: the export skips archived shelves

    Run this, and nothing else:

    /prd-workflow:to-prd

    Follow the skill exactly and stop where it stops.
  max_turns: 30
  timeout_seconds: 300
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: regex
    name: readiness-section-present
    target: { source: file, path: prd.md }
    pattern: '^## Readiness\s*$'
    flags: m
  - type: regex
    name: carries-the-credential-item
    target: { source: file, path: prd.md }
    pattern: 'platform team'
  - type: regex
    name: carries-the-dependency-item
    target: { source: file, path: prd.md }
    pattern: 'ATL-88'
  - type: regex
    name: carries-the-given-criterion
    target: { source: file, path: prd.md }
    pattern: 'skips archived shelves'
  - type: regex
    name: title-carries-the-prd-prefix
    target: { source: file, path: prd.md }
    pattern: '\[PRD\]'
