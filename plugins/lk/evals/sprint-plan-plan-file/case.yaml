schema_version: "1.0"
name: sprint-plan-plan-file
summary: "The sprint planner writes the plan file's header and states, and a re-run leaves a developer-edited row intact."
description: >
  `lk:sprint-plan` twice at the root of a projects directory holding two child repos, with the
  sprint handed in as local sprint files so no tracker is called. Between the runs the session,
  acting as the developer, edits one row's Note cell. The sprint read by the second run adds a
  ticket whose natural group is that edited row. The external behaviour under test is
  `.sprint/plan.md`: its header, the Groups column row, the states line, the edited row left as
  the developer wrote it, and the new ticket placed in another row. The copied night script is
  checked to exist. The scaffold makes each child a git repository and leaves the root out of git.
tags: [micro, sprint-plan]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    There is no human on the other end of this session, and no network: do not call the
    Atlassian MCP, `gh`, or any other tracker. The working directory is the root of a projects
    directory holding `atelier-web/` and `atelier-api/`.

    The developer's answers, given in advance, so do not wait for them:

    - Ticket source site `example.atlassian.net`; sprint query
      `sprint in openSprints() AND project = ATL`.
    - Repo map: component `Web` → `atelier-web`, component `API` → `atelier-api`.
    - Accept every group proposal exactly as you offer it, and every placement of a new ticket.

    Do these three steps in order, following the skill exactly:

    1. Run `/lk:sprint-plan sprint-1.json`.
    2. Acting as the developer, use one Edit on `.sprint/plan.md` to set the Note cell of the
       row holding ATL-12 to `hand-edited: keep`. Change nothing else, and do not touch
       `.sprint/plan.snapshot.md`.
    3. Run `/lk:sprint-plan sprint-2.json`.

    Stop after the second run's final print.
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: file_exists
    name: plan-file-written
    path: .sprint/plan.md

  - type: file_exists
    name: night-script-copied
    path: .sprint/night.sh

  - type: regex
    name: header-ticket-source
    target: { source: file, path: .sprint/plan.md }
    pattern: 'Ticket source:.*example\.atlassian\.net'

  - type: regex
    name: header-sprint-query
    target: { source: file, path: .sprint/plan.md }
    pattern: 'Sprint query:.*openSprints'

  - type: regex
    name: groups-columns
    target: { source: file, path: .sprint/plan.md }
    pattern: '^\|\s*Id\s*\|\s*Tickets\s*\|\s*Repo\s*\|\s*State\s*\|\s*PRD\s*\|\s*PR\s*\|\s*Note\s*\|\s*$'
    flags: m

  - type: regex
    name: eight-states
    target: { source: file, path: .sprint/plan.md }
    pattern: 'States: planned · grilled · runnable · running · ran · done · blocked · needs-human'

  - type: regex
    name: edited-row-intact
    target: { source: file, path: .sprint/plan.md }
    pattern: '^\|[^\n]*ATL-12, ATL-14[^\n]*\|\s*hand-edited: keep\s*\|\s*$'
    flags: m

  - type: regex
    name: edited-row-took-no-ticket
    target: { source: file, path: .sprint/plan.md }
    pattern: '^\|[^\n]*ATL-15[^\n]*hand-edited: keep'
    flags: m
    match: not_contains

  - type: regex
    name: new-ticket-planned
    target: { source: file, path: .sprint/plan.md }
    pattern: '^\|\s*G\d+\s*\|[^\n]*ATL-15[^\n]*\|\s*atelier-web\s*\|\s*planned\s*\|'
    flags: m
