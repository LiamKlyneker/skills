schema_version: "1.0"
name: to-spec-no-readiness-section
summary: "A conversation with no readiness block yields a [SPEC] with no `## Readiness` section."
description: >
  The sibling of `to-spec-readiness-section`: the same grill, with no `/lk:readiness` block in
  the conversation. The `[SPEC]` body must carry no `## Readiness` section, no stub and no
  "None" placeholder. There is no tracker and no network here, so the prompt has the run write
  the body to a file instead of publishing it.
tags: [micro, to-spec]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project, already a git repository with one commit
    (`fixture: scaffold snapshot`). Its adapter is `.claude/project/adapter.md`.

    A run's read scope ends at the plugin directory, and the skill reaches its shared
    references through a symlink that points out of it. So wherever the skill says
    `../_shared/<name>.md` or `_shared/<name>.md`, read `<name>.md` in this working directory —
    `fidelity-ledger.md`, `ado-workitem-authoring.md` and `final-prints.md` are placed here for
    that reason.

    There is no network and no tracker here. Do not call any `mcp__ado__*` tool, skip the MCP
    probe, and do not publish. The lead work item is #4790, "Shelf header total", an
    existing requirement-level item with no children, so the mode is CREATE. Write the `[SPEC]`
    body, exactly as it would be sent as the work item's description, to `./spec.md`. Do not
    interview me.

    The grill settled this plan:

    - `countShelves` in `lib/shelf-count.ts` counts archived shelves, so the header total
      overstates what a user can open. It must count only shelves whose `archived` is `false`.
    - Archived shelves never count toward the total. Nothing calls the function with an
      "include archived" option.
    - The archive action itself is out of scope.

    Run this, and nothing else:

    /ado-workflow:to-spec

    Follow the skill exactly and stop where it stops.
  max_turns: 30
  timeout_seconds: 300
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: regex
    name: scope-section-present
    target: { source: file, path: spec.md }
    pattern: '^## Scope\s*$'
    flags: m
  - type: regex
    name: no-readiness-section
    target: { source: file, path: spec.md }
    pattern: 'Readiness'
    match: not_contains
