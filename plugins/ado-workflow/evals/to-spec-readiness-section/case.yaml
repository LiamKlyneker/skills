schema_version: "1.0"
name: to-spec-readiness-section
summary: "A readiness block in the conversation becomes a `## Readiness` section in the [SPEC]."
description: >
  `to-spec` after a grill and a `/lk:readiness` pass, with the block printed in the prompt as
  the conversation would hold it. The external behaviour under test is the `[SPEC]` body: it
  carries a `## Readiness` section with the block's items, each sub-list emitted as `<ul>`/`<li>`
  markup because the first UPDATE pass turns a markdown list into one run of text. A `[SPEC]`
  written from a conversation with no block must carry no such section; that half is checked by
  the sibling case `to-spec-no-readiness-section`. There is no tracker and no network here, so
  the prompt has the run write the body to a file instead of publishing it.
tags: [micro, to-spec]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project, already a git repository with one commit
    (`fixture: scaffold snapshot`). Its adapter is `.claude/project/adapter.md`.

    A run's read scope ends at the plugin directory, and the skill reaches its shared
    references through a symlink that points out of it. So wherever the skill says
    `../_shared/<name>.md` or `_shared/<name>.md`, read `<name>.md` in this working directory —
    `fidelity-ledger.md`, `ado-workitem-authoring.md` and `final-prints.md` are placed here for
    that reason.

    There is no network and no tracker here. Do not call any `mcp__ado__*` tool, skip the MCP
    probe, and do not publish. The lead work item is #4790, "Shelf header total", an
    existing requirement-level item with no children, so the mode is CREATE. Write the `[SPEC]`
    body, exactly as it would be sent as the work item's description, to `./spec.md`. Do not
    interview me.

    The grill settled this plan:

    - `countShelves` in `lib/shelf-count.ts` counts archived shelves, so the header total
      overstates what a user can open. It must count only shelves whose `archived` is `false`.
    - Archived shelves never count toward the total. Nothing calls the function with an
      "include archived" option.
    - The archive action itself is out of scope.

    `/lk:readiness` then ran, and this block is in the conversation:

    ## Readiness

    ### Missing context
    - The export job's path — given: `lib/export.ts`

    ### Credential or access
    - Read-only staging catalog key — external step: request it from the platform team

    ### External dependency
    - Shelf-schema ticket ATL-88 — external step: wait for it to land

    ### Ambiguous acceptance criterion
    - "Export behaves sensibly" — given: the export skips archived shelves

    Run this, and nothing else:

    /ado-workflow:to-spec

    Follow the skill exactly and stop where it stops.
  max_turns: 30
  timeout_seconds: 300
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: regex
    name: readiness-section-present
    target: { source: file, path: spec.md }
    pattern: '^## Readiness\s*$'
    flags: m
  - type: regex
    name: carries-the-credential-item
    target: { source: file, path: spec.md }
    pattern: 'platform team'
  - type: regex
    name: carries-the-dependency-item
    target: { source: file, path: spec.md }
    pattern: 'ATL-88'
  - type: regex
    name: carries-the-given-criterion
    target: { source: file, path: spec.md }
    pattern: 'skips archived shelves'
  - type: regex
    name: sub-lists-are-html-lists
    target: { source: file, path: spec.md }
    pattern: '<li>'
  - type: regex
    name: scope-section-still-present
    target: { source: file, path: spec.md }
    pattern: '^## Scope\s*$'
    flags: m
