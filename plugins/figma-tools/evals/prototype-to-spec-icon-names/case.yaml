schema_version: "1.0"
name: prototype-to-spec-icon-names
description: >
  The brief prototype-to-spec writes for one ticket against the Vitrine fixture prototype.
  The prototype draws its own glyphs and gives them its own names; the ledger has to carry the
  design system's export names instead, one row per element, each citing the source it read.
tags: [prototype-to-spec, full]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory holds a pnpm workspace. The project you are working in is the
    Vitrine consumer app at `apps/consumer/`: its adapter is
    `apps/consumer/.claude/project/adapter.md`, and that adapter is the one this run reads.

    `ticket.md` in the working directory is the ticket the brief is for.

    Run this, and nothing else:

    /figma-tools:prototype-to-spec ticket.md --out ./brief.md

    Follow the skill exactly and stop where it stops.
  max_turns: 150
  timeout_seconds: 2700
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: regex
    name: brief-written
    target: { source: file, path: brief.md }
    pattern: "## Fidelity ledger"
  - type: regex
    name: tick-carries-its-ds-name
    target: { source: file, path: brief.md }
    pattern: TallyMarkIcon
  - type: regex
    name: tick-not-renamed-to-a-check
    target: { source: file, path: brief.md }
    pattern: CheckIcon|CheckMark|Checkmark|\bCheck\b
    match: not_contains
  - type: regex
    name: magnifier-carries-its-ds-name
    target: { source: file, path: brief.md }
    pattern: LoupeGlassIcon
  - type: regex
    name: empty-glyph-carries-its-ds-name
    target: { source: file, path: brief.md }
    pattern: DustCoverIcon
  - type: regex
    name: add-glyph-carries-its-ds-name
    target: { source: file, path: brief.md }
    pattern: NewNicheIcon
  - type: regex
    name: no-conventional-icon-names
    target: { source: file, path: brief.md }
    pattern: PlusIcon|XIcon|SearchIcon|CloseIcon|MagnifierIcon|TickIcon
    match: not_contains
  - type: regex
    name: copy-comes-from-the-spec-not-the-stale-handoff
    target: { source: file, path: brief.md }
    pattern: No shelves found\.
  - type: regex
    name: every-row-off-the-shelf-cites-a-source
    target: { source: file, path: brief.md }
    pattern: ^\|(?!.*\.tsx).*(local component|DS with overrides|DS change)
    flags: m
    match: not_contains
  - type: regex
    name: no-consumer-vocabulary
    target: { source: file, path: brief.md }
    pattern: neonplace|creative-ghost|liam-klyneker/liamklyneker
    match: not_contains
  - type: llm
    name: every-in-scope-element-has-ledger-rows
    focus: { source: file, path: brief.md }
    criteria: |
      The brief's `## Fidelity ledger` has at least one row for every element the ticket's two
      components are built from, each row naming the element in the design's own words:

      - the picker panel itself (the popover surface, with its border and its lift)
      - the click-away layer behind it
      - the search field, with its glyph and its underline
      - a shelf row, with its tick column and its label
      - the empty result — its glyph and the line under it
      - the New shelf row at the foot of the list

      Every one of those rows fills `Layout facts` with words about nesting, stacking or which
      element owns a divider or padding — not just a component name — and gives each icon it
      mentions a name, a size and a colour token.

      Score it failed if any of the six is missing from the ledger, or if a row exists but its
      `Layout facts` cell is empty or is only a component name.
