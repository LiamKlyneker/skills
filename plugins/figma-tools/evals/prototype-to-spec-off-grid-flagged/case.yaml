schema_version: "1.0"
name: prototype-to-spec-off-grid-flagged
summary: "An off-grid px value gets a ⚠ off-grid flag, not a token."
description: >
  The brief prototype-to-spec writes for one ticket against a hand-written stub project — no
  workspace, no build, no captures, one component. The stub's adapter carries only the rows this
  skill reads: `## Repo` for the tracker and the DS-gap backlog, `## Design system` for the
  catalog pointer, the class prefixes, the icon ladder and the usage-rules sources, and
  `### Prototype source` for `Path:`, `Spec files:`, `Schema:` and `Screenshots:`. The chip's
  padding lands between two steps of a deliberately non-uniform spacing scale, so it has no
  token; the run has to hand that decision over rather than settle it.
tags: [micro]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project. Its adapter is `.claude/project/adapter.md`, and that
    adapter is the one this run reads.

    `ticket.md` in the working directory is the ticket the brief is for.

    Run this, and nothing else:

    /figma-tools:prototype-to-spec ticket.md --out ./brief.md

    Follow the skill exactly and stop where it stops.
  max_turns: 30
  timeout_seconds: 300
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: regex
    name: brief-written
    target: { source: file, path: brief.md }
    pattern: "## Fidelity ledger"

  - type: regex
    name: raw-padding-survives-unchanged-into-a-ledger-row
    target: { source: file, path: brief.md }
    pattern: '^\|[^\n]*\b10px\b'
    flags: m

  - type: regex
    name: raw-padding-carries-the-off-grid-flag
    target: { source: file, path: brief.md }
    pattern: '⚠[^\n]{0,2}off-grid'

  - type: regex
    name: off-grid-flag-names-the-nearest-token
    target: { source: file, path: brief.md }
    pattern: 'off-grid[^\n]*(?:--space-|\b8px\b|\b12px\b)'
    flags: m

  - type: regex
    name: off-grid-flag-names-the-delta
    target: { source: file, path: brief.md }
    pattern: 'off-grid[^\n]*(?:Δ|delta|\b2px\b|\bby 2\b|\+2|−2|-2)'
    flags: mi

  - type: regex
    name: raw-padding-gets-a-proposed-ds-gap-row
    target: { source: file, path: brief.md }
    pattern: '## DS gaps \(proposed, not filed\)(?:(?!\n## )[\s\S])*?10px'

  - type: regex
    name: ledger-row-is-a-grill-question-with-both-options
    target: { source: file, path: brief.md }
    pattern: '^\|(?=[^\n]*\b10px\b)(?=[^\n]*grill question)(?=[^\n]*(?:--space-|\b8px\b|\b12px\b))[^\n]*$'
    flags: m

  - type: regex
    name: the-one-text-run-carries-its-type-token
    target: { source: file, path: brief.md }
    pattern: 'type-label'

  - type: regex
    name: nearest-token-never-silently-substituted-for-the-value
    target: { source: file, path: brief.md }
    pattern: '^(?![^\n]*\b10px\b)[^\n]*padding[^\n]*\b(?:8px|12px)\b'
    flags: mi
    match: not_contains

  - type: regex
    name: no-consumer-vocabulary
    target: { source: file, path: brief.md }
    pattern: neonplace|creative-ghost|liam-klyneker/liamklyneker
    match: not_contains
