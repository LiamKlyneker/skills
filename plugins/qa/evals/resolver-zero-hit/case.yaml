schema_version: "1.0"
name: resolver-zero-hit
summary: "A branch with no key anywhere and one open pull request runs with no ticket, its criteria inferred, and never asks which ticket."
description: >
  The `prove-branch` resolver's no-ticket path against a stub project on GitHub. The branch
  `shelf-archive` has one open pull request, #57, whose body mentions `PRD #40` without the colon
  and never as a whole `PRD: #<n>` line; no commit subject ends in `(#N)`; and the adapter has no
  `Ticket source:` line. Every key yields nothing, and the branch has exactly one open pull
  request, so the run is not a stop: it says it has no ticket, lists what each key found, and says
  its criteria are inferred from the pull request. It then stops at the preview, since no URL
  answers offline.
tags: [micro, prove-branch]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project: a git repository checked out on the branch under
    test, with its default branch `main` beside it. Its adapter is `.claude/project/adapter.md`.

    On macOS, `git` can fail here with an `xcrun` cache error that says nothing about the
    repository. If it does, run git as `"$(xcode-select -p)/usr/bin/git"` for the rest of the
    run.

    There is no network here: `gh` is not available, and no URL answers. The files under
    `.stand-in/` hold what `gh` would return for this branch. Read them wherever the skill runs
    `gh`, and do not run `gh`:

    - `.stand-in/gh-pr-list.json` — the open pull requests whose head is this branch, with every
      field the skill's `gh pr list` asks for.
    - `.stand-in/gh-pr-view.json` — `gh pr view` for that pull request: `state`, `isDraft`,
      `headRefOid` and `comments`.
    - `.stand-in/tickets.json` — the tickets this branch could name, with their titles.

    Run this, and nothing else:

    /qa:prove-branch

    Follow the skill exactly and stop where it stops. Your final message carries what the skill
    printed up to that point: the run it picked, what each key found, and the stop.
  max_turns: 30
  timeout_seconds: 300
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: regex
    name: stop-names-the-branch
    target: last_message
    pattern: 'shelf-archive'

  - type: regex
    name: says-there-is-no-ticket
    target: last_message
    pattern: '(?:ticket\W{0,4}none|no ticket)'
    flags: i

  - type: regex
    name: says-the-criteria-are-inferred
    target: last_message
    pattern: 'inferred'
    flags: i

  - type: regex
    name: never-asks-which-ticket
    target: last_message
    pattern: 'which ticket[^\n]*\?'
    flags: i
    match: not_contains

  - type: regex
    name: not-the-resolver-stop
    target: last_message
    pattern: 'cannot resolve the run'
    flags: i
    match: not_contains

  - type: regex
    name: names-the-open-pull-request
    target: last_message
    pattern: '#57\b'

  - type: regex
    name: key-1-none
    target: last_message
    pattern: 'key 1\b[^\n]*\bnone\b'
    flags: i

  - type: regex
    name: key-2-not-applicable
    target: last_message
    pattern: 'key 2\b[^\n]*\bnot applicable\b'
    flags: i

  - type: regex
    name: key-3-none
    target: last_message
    pattern: 'key 3\b[^\n]*\bnone\b'
    flags: i

  - type: regex
    name: key-4-none-or-not-applicable
    target: last_message
    pattern: 'key 4\b[^\n]*\b(?:none|not applicable)\b'
    flags: i

  - type: regex
    name: key-1-never-reports-the-near-miss-as-its-hit
    target: last_message
    pattern: 'key 1 \([^)]*\)\W{0,4}#40\b'
    flags: i
    match: not_contains
