schema_version: "1.0"
name: composer-unverifiable-state
summary: "A flow whose state is set in another application and has no account is Unable to verify, naming the seeder hint, before any driver starts."
description: >
  The `prove-branch` composer and state resolution against the stub shelves page on GitHub. The
  branch touches `app/shelves/`, whose `KNOWLEDGE.md` is planted. Ticket #12 has three
  acceptance criteria. Two start from S1, a team with a shelf that is not archived, which
  `accounts.md` holds as team `t-301` with shelves `s-11` and `s-12`. The third, the overdue
  loans banner, can only start from S3, a loan recorded in the library's lending desk app, which
  `accounts.md` has no row for. The run must compose that flow from S3, mark it Unable to verify
  because the state is set in another application, name the `seed:overdue-loan` hint, show the
  other two criteria covered, stop at the approval gate, and start no driver.
tags: [micro, prove-branch]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project: a git repository checked out on the branch under
    test, with its default branch `main` beside it. Its adapter is `.claude/project/adapter.md`.

    On macOS, `git` can fail here with an `xcrun` cache error that says nothing about the
    repository. If it does, run git as `"$(xcode-select -p)/usr/bin/git"` for the rest of the
    run.

    This sandbox denies the Edit and Write tools, and shell redirection, on any path under
    `.claude/`. When the skill writes `.claude/project/accounts.md`, make the same change with a
    short `python3` script run through Bash, which reads the file and writes it back.

    There is no network here: `gh` is not available, and no request reaches any URL. The files
    under `.stand-in/` hold what would come back. Read them in place of the call, and do not
    run `gh`:

    - `.stand-in/gh-pr-list.json` — the open pull requests whose head is this branch, with every
      field the skill's `gh pr list` asks for.
    - `.stand-in/gh-pr-view.json` — `gh pr view` for that pull request: `state`, `isDraft`,
      `headRefOid` and `comments`.
    - `.stand-in/tickets.json` — the ticket, with its title and body.
    - `.stand-in/target-checks.md` — what the target answers to each request the skill makes
      against it.

    For `gh pr diff`, run `git diff main...HEAD`.

    As the developer, for this session: run against my local target `http://127.0.0.1:4100`.
    I started it from `HEAD`, and it is a staging target.
    I am not here to answer the approval gate, so show it and stop there.

    Run this, and nothing else:

    /qa:prove-branch

    Follow the skill exactly and stop where it stops. Your final message carries what the skill
    printed at the end of the turn: the approval gate as the skill shows it, or the stop.
  max_turns: 60
  timeout_seconds: 600
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: regex
    name: flow-starts-from-the-another-app-state
    target: last_message
    pattern: 'start from:[^\n]*\bS3\b'

  - type: regex
    name: marks-a-flow-unable-to-verify
    target: last_message
    pattern: 'unable to verify'
    flags: i

  - type: regex
    name: names-the-seeder-hint
    target: last_message
    pattern: 'seed:overdue-loan'

  - type: regex
    name: s1-resolves-to-its-account
    target: last_message
    pattern: 's-11'

  - type: regex
    name: criterion-1-covered
    target: last_message
    pattern: '\|\s*1\s*\|[^\n]*\bcovered\b'
    flags: i

  - type: regex
    name: criterion-2-covered
    target: last_message
    pattern: '\|\s*2\s*\|[^\n]*\bcovered\b'
    flags: i

  - type: regex
    name: no-criterion-row-uncovered
    target: last_message
    pattern: '\|[^\n]*\buncovered\b'
    flags: i
    match: not_contains

  - type: regex
    name: s3-flow-is-unable-to-verify-not-a-stop
    target: last_message
    # The S3 flow is shown with its Unable-to-verify mark beside the S1 flow's account, so the run
    # reached the gate rather than stopping on S3.
    pattern: '(?:start from:[^\n]*\bS3\b[\s\S]{0,600}?unable to verify|unable to verify[\s\S]{0,600}?start from:[^\n]*\bS3\b)'
    flags: i

  # A `tool_used` grader cannot express "called zero times", so the trace is the evidence.
  - type: regex
    name: no-driver-spawned
    target: trace
    pattern: '"subagent_type":"[^"]*qa-driver'
    match: not_contains
