schema_version: "1.0"
name: states-rerun-refresh-and-stale
summary: "A rerun with no argument refreshes Last verified on a row still visible and marks a vanished row stale without deleting it."
description: >
  The `setup-states` rerun against the stub shelves page. accounts.md lists S1 on shelves `s-11`
  and `s-12` and S4 on archived shelf `s-40`, both verified 2026-09-30. The stand-in still shows
  `s-11` and `s-12`, while `s-40` is gone and the page has no Archived section. The run must
  give the S1 row today's date with its origin unchanged, mark the S4 row `stale <date>` with
  its ids and origin kept, delete no row and add none, and name the command that sets S4 up
  again.
tags: [micro, setup-states]
runs: 1
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    The working directory is the project: a git repository checked out on a working branch, with
    its default branch `main` beside it. Its adapter is `.claude/project/adapter.md`.

    On macOS, `git` can fail here with an `xcrun` cache error that says nothing about the
    repository. If it does, run git as `"$(xcode-select -p)/usr/bin/git"` for the rest of the
    run.

    This sandbox denies the Edit and Write tools, and shell redirection, on any path under
    `.claude/`. When the skill writes `.claude/project/accounts.md`, make the same change with a
    short `python3` script run through Bash, which reads the file and writes it back.

    There is no network and no browser here: the Playwright MCP tools are not in this session,
    and no request reaches any URL. `.stand-in/target-pages.md` holds what the target would
    answer — the saved session's check, and what `browser_snapshot` returns for each page. Treat
    the Playwright MCP readiness check as passed, and read that file in place of the session
    check, `browser_navigate` and `browser_snapshot`, at the point the skill would make them. Do
    not run `curl` or any other request.

    As the developer, for this session: my staging target is `http://127.0.0.1:4100`. I am not
    here to answer questions or to do steps in the app, so when the skill asks me something or
    waits for me, show it and stop there.

    Run this, and nothing else:

    /qa:setup-states

    Follow the skill exactly and stop where it stops. Your final message carries what the skill
    prints at the end of the turn.
  max_turns: 40
  timeout_seconds: 600
  model: claude-sonnet-5
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: regex
    name: s1-last-verified-refreshed
    target: { source: file, path: .claude/project/accounts.md }
    pattern: '\n\| *staging *\|[^\n]*\| *S1 *\|[^|\n]*s-11[^|\n]*\| *(?!2026-09-30)20\d\d-\d\d-\d\d *\| *setup-states 2026-09-30 *\|'

  - type: regex
    name: s4-marked-stale
    target: { source: file, path: .claude/project/accounts.md }
    pattern: '\n\| *staging *\|[^\n]*\| *S4 *\|[^|\n]*s-40[^|\n]*\| *stale 20\d\d-\d\d-\d\d *\| *setup-states 2026-09-30 *\|'

  - type: regex
    name: one-s1-row
    target: { source: file, path: .claude/project/accounts.md }
    pattern: '\| *S1 *\|[\s\S]*\| *S1 *\|'
    match: not_contains

  - type: regex
    name: one-s4-row
    target: { source: file, path: .claude/project/accounts.md }
    pattern: '\| *S4 *\|[\s\S]*\| *S4 *\|'
    match: not_contains

  - type: regex
    name: names-the-command-for-the-stale-state
    target: last_message
    pattern: '/qa:setup-states[^\n]*\bS4\b'

  - type: regex
    name: never-commits
    target: trace
    pattern: '"command":"(?:[^"\\]|\\.)*\bgit\b(?:[^"\\]|\\.)*\s(?:commit|add)\b'
    match: not_contains

  - type: regex
    name: no-agent-dispatched
    target: trace
    pattern: '"subagent_type":"'
    match: not_contains
